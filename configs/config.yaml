# Educational Video Ranking Experiment Configuration
project:
  title: "Explainable Educational Video Ranking Using Hybrid Semantic Intelligence and LLM-Assisted Engagement Analysis"
  version: "2.0.0"
  author: "Chennareddy Nayanesh Reddy"

models:
  embedding: "intfloat/e5-base-v2"
  embedding_dim: 768
  embedding_normalization: "L2"
  sentiment: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  teaching_score_llm: "gemini-3.5-flash-lite"

scoring_weights:
  fes:
    emotional_engagement: 0.4
    emotional_variance_inverted: 0.2
    likes_normalized: 0.2
    comments_normalized: 0.2
  iqs:
    semantic_alignment: 0.3
    duration_depth_proxy: 0.2
    lexical_diversity_ttr: 0.2
    teaching_score: 0.3

hybrid_fusion:
  adaptive_scaling_k: 5.0
  formula: "Hybrid_i = alpha_i * FES_i + (1 - alpha_i) * IQS_i"
  alpha_formula: "alpha_i = min(1.0, ln(1 + C_rel_i) / k)"

evaluation:
  benchmark: "LAK 2026 Expert Relevance Benchmark"
  topics_count: 54
  accessible_pairs_count: 888
  accessible_videos_count: 841
  metrics:
    - "NDCG@5"
    - "NDCG@10"
    - "MAP@10"
    - "MRR"
    - "Precision@5"
    - "Precision@10"
    - "Recall@5"
    - "Recall@10"
  statistical_testing:
    test: "Paired Wilcoxon signed-rank test (two-sided)"
    bootstrap_samples: 5000
    confidence_level: 0.95
    random_seed: 42

internal_cohort:
  total_videos: 98
  domains:
    Biology: 20
    Data Science: 19
    Mathematics: 20
    Physics: 19
    Programming: 20
