[project]
name = "edu-genai-evaluator"
version = "0.1.0"
description = "LAK 2025 generative ai educational content generation evaluation tool"
readme = "README.md"
requires-python = ">=3.12.0"
dependencies = [
    "aiosqlite>=0.20.0",
    "click>=8.1.8",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "litellm>=1.59.8",
    "loguru>=0.7.3",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "tokenizers>=0.21.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.51.3",
]

[dependency-groups]
dev = [
    "marimo>=0.13.9",
    "pyarrow>=20.0.0",
    "ruff>=0.11.10",
]
